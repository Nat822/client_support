services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: client_support
      POSTGRES_USER: client_support
      POSTGRES_PASSWORD: client_support
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U client_support -d client_support"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
