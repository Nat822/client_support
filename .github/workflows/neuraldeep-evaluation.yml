name: NeuralDeep Evaluation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluation mode
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - evaluation
      model:
        description: NeuralDeep model
        required: true
        default: qwen3.6-35b-a3b
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEURALDEEP_API_KEY: ${{ secrets.NEURALDEEP_API_KEY }}
      NEURALDEEP_MODEL: ${{ inputs.model }}
      NEURALDEEP_DATASET: ${{ inputs.mode == 'smoke' && 'evaluation/order_tracking_smoke.jsonl' || 'evaluation/order_tracking_extended.jsonl' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Validate secret is configured
        run: |
          if [ -z "$NEURALDEEP_API_KEY" ]; then
            echo "NEURALDEEP_API_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Run NeuralDeep evaluation
        run: python scripts/evaluate_neuraldeep.py | tee neuraldeep-evaluation.json

      - name: Upload evaluation result
        uses: actions/upload-artifact@v4
        with:
          name: neuraldeep-evaluation-result
          path: neuraldeep-evaluation.json
          if-no-files-found: error
